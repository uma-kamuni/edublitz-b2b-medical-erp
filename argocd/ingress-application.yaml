apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: med-erp-ingress
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/uma-kamuni/edublitz-b2b-medical-erp.git
    targetRevision: dev
    path: k8s/ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true